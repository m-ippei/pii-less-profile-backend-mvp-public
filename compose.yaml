# 共通定義。local / staging / production で同じ構造を使う。
# 環境差分は override(compose.local.yaml 等)、環境変数、Secret、Volume、Proxy設定に限る。
# ここにはbuild指定を置かない（staging/productionはdigest指定のImageだけを使うため）。
name: anon-profile

services:
  app:
    image: ${APP_IMAGE:-anon-profile-app:dev}
    init: true
    restart: unless-stopped
    stop_grace_period: 30s          # graceful shutdown (IMPLEMENTATION §4)
    environment:
      ENV: ${ENV:?ENV is required}
      DATABASE_PATH: /data/app.db
      APP_PEPPER: ${APP_PEPPER:?APP_PEPPER is required}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
      TRUSTED_PROXY_COUNT: "1"      # Reverse Proxy 1段
      ARGON2_TIME_COST: ${ARGON2_TIME_COST:-3}
      ARGON2_MEMORY_KIB: ${ARGON2_MEMORY_KIB:-65536}
      ARGON2_PARALLELISM: ${ARGON2_PARALLELISM:-4}
      ARGON2_MAX_CONCURRENCY: ${ARGON2_MAX_CONCURRENCY:-2}
      # 容量 fail-closed のしきい値（design/07 §8 / design/10 §11。既定10,000）。D-14。
      RATE_LIMIT_MAX_KEYS: ${RATE_LIMIT_MAX_KEYS:-10000}
      TZ: UTC
    volumes:
      - app-data:/data              # SQLite本体+WAL/SHM。named volume（bind mount禁止）
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    expose:
      - "8000"                      # 公開しない。Reverse Proxyからのみ到達

  reverse-proxy:
    # digest固定（manifest list digest）。更新は Dependabot（docker ecosystem）のPRで受ける（design/16 §18）。
    image: caddy:2.11-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      HSTS_VALUE: ${HSTS_VALUE:-max-age=0}
    volumes:
      - ./deploy/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data            # 証明書・local CA
      - caddy-config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true

volumes:
  app-data:
  caddy-data:
  caddy-config:
