# /etc/systemd/journald.conf.d/anon-profile.conf に配置 → systemctl restart systemd-journald
[Journal]
Storage=persistent
# 設計（ip_daily の保持30日）に合わせる。
MaxRetentionSec=30day
# 古いデータの削除はファイル単位。ローテーションを1日にして「30日」の精度を約1日にする
# （既定の1か月ローテーションだと、最大で約2か月分が残りうる）。
MaxFileSec=1day
# 容量の上限（超えると30日未満でも古いものから消える。monitor.sh が JOURNAL_WARN_MB で警告）
SystemMaxUse=1G
SystemKeepFree=1G
Compress=yes
