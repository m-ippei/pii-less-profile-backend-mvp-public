<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>秘密値の保存確認</title>
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<main>
<h1>秘密値を保存してください</h1>
<p id="empty-message" hidden>表示できる秘密値がありません。作成・パスワード変更・回復の直後に開いてください。</p>
<section id="secrets-content">
<p>次の値は一度しか表示されません。これらを失うと復旧できません。「保存した」にチェックするまで次へ進めません。</p>

<label for="identity-label">管理識別用文字（任意）</label>
<input id="identity-label" type="text" maxlength="64" autocomplete="off">

<section id="secret-login-id-block">
<h2>ログインID</h2>
<pre id="login-id-value" class="secret"></pre>
</section>

<section id="secret-password-block">
<h2>パスワード</h2>
<pre id="password-value" class="secret"></pre>
<p>表示識別文字: <span id="password-label"></span></p>
</section>

<section id="secret-recovery-block">
<h2>リカバリーキー</h2>
<pre id="recovery-key-value" class="secret"></pre>
</section>

<p id="old-key-note" hidden>以前のリカバリーキーは失効しました。以後はこの新しいキーを使ってください。</p>

<button type="button" id="copy">秘密値をコピー</button>
<button type="button" id="save-all">全体保存（メモ用）</button>
<p id="copy-status" role="status"></p>

<label for="saved"><input id="saved" type="checkbox"> 保存した</label>
<button type="button" id="continue" disabled>続ける</button>
</section>
</main>
<script src="/static/js/secrets.js"></script>
<script src="/static/js/credentials-saved.js"></script>
</body>
</html>
